name: Keep the review panel warm

# Render's free tier puts a service to sleep after 15 minutes of no traffic, and
# a cold start takes about a minute — longer than the app's 15-second sign-in
# timeout. An App Review session that lands on a sleeping instance therefore
# sees "Couldn't reach the server" on the first attempt, which reads as a broken
# app rather than as a sleeping demo server.
#
# A ping every ten minutes keeps it awake. GitHub delays scheduled runs under
# load, so the interval is deliberately well inside the fifteen-minute window.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the panel
        run: |
          # --max-time covers a cold start; the point of this request is to pay
          # that cost here rather than have a reviewer pay it.
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 180 \
            https://properiptv-review-panel.onrender.com/health)
          echo "HTTP $code"
          cat /tmp/health.json; echo
          test "$code" = "200"
